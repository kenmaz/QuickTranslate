			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -e\n# archive 時は配布物作成中なので /Applications/ への上書きをスキップ。\n# Xcode は archive のビルドフェーズに ACTION=install を渡す (archive ではない) ので両方見る。\n# install 時の BUILT_PRODUCTS_DIR にあるのは DSTROOT へのシンボリックリンクなので、\n# ここで cp すると /Applications/ に壊れたリンクが残ってしまう。\ncase \"$ACTION\" in archive|install) exit 0 ;; esac\nDEST=\"/Applications/$PRODUCT_NAME.app\"\n# 隠し名にする。/Applications 直下に .app を晒すと LaunchServices が別アプリとして拾う\nSTAGING=\"/Applications/.$PRODUCT_NAME-install.app\"\n# INT/TERM のハンドラは exit しないと中断地点の次から実行が再開され、\n# 掃除した直後に rm -rf \"$DEST\" まで進んでアプリが消える\ntrap 'rm -rf \"$STAGING\"' EXIT\ntrap 'rm -rf \"$STAGING\"; exit 1' INT TERM\n# 先にコピーを済ませてから差し替える。cp が失敗しても既存アプリは無傷。\n# rm -rf は cp -R のマージを避けるためと、壊れたシンボリックリンクが残っている環境で\n# cp が `Not a directory` になるのを避けるために必要。\n# なお rm と mv の間で中断されるとアプリは消える。その場合はビルドし直せば戻る。\n# 同じプロジェクトの並行ビルドは想定しない (最後の 1 本が勝つ)。\nif ! { rm -rf \"$STAGING\" &&\n       cp -R \"$BUILT_PRODUCTS_DIR/$PRODUCT_NAME.app\" \"$STAGING\" &&\n       rm -rf \"$DEST\" &&\n       mv \"$STAGING\" \"$DEST\"; }; then\n  # /Applications に書けない環境 (標準ユーザー、MDM 管理端末、CI など) でも\n  # ビルド自体は通す。ただし成功したように見せない。\n  echo \"warning: $DEST へのインストールに失敗しました (ビルドは成功)\" >&2\n  exit 0\nfi\necho \"✅ $DEST にインストールしました\"\n";
		};
