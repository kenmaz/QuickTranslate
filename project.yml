name: QuickTranslate
options:
  bundleIdPrefix: net.kenmaz
  deploymentTarget:
    macOS: "26.0"

targets:
  QuickTranslate:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: SupportingFiles/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.kenmaz.QuickTranslate
        SWIFT_VERSION: 5.9
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        INFOPLIST_FILE: SupportingFiles/Info.plist
        CODE_SIGN_ENTITLEMENTS: SupportingFiles/QuickTranslate.entitlements
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      - script: |
          set -e
          # archive 時は配布物作成中なので /Applications/ への上書きをスキップ。
          # Xcode は archive のビルドフェーズに ACTION=install を渡す (archive ではない) ので両方見る。
          # install 時の BUILT_PRODUCTS_DIR にあるのは DSTROOT へのシンボリックリンクなので、
          # ここで cp すると /Applications/ に壊れたリンクが残ってしまう。
          case "$ACTION" in archive|install) exit 0 ;; esac
          DEST="/Applications/$PRODUCT_NAME.app"
          # 隠し名にする。/Applications 直下に .app を晒すと LaunchServices が別アプリとして拾う
          STAGING="/Applications/.$PRODUCT_NAME-install.app"
          trap 'rm -rf "$STAGING"' EXIT INT TERM
          # 先にコピーを済ませてから差し替える。cp が失敗しても既存アプリは無傷で、
          # set -e によりビルドが落ちる (成功扱いで消えたままにはならない)。
          # rm -rf は cp -R のマージを避けるためと、壊れたシンボリックリンクが残っている環境で
          # cp が `Not a directory` になるのを避けるために必要。
          # なお rm と mv の間で中断されるとアプリは消える。その場合はビルドし直せば戻る。
          # 同じプロジェクトの並行ビルドは想定しない (最後の 1 本が勝つ)。
          rm -rf "$STAGING"
          cp -R "$BUILT_PRODUCTS_DIR/$PRODUCT_NAME.app" "$STAGING"
          rm -rf "$DEST"
          mv "$STAGING" "$DEST"
          echo "✅ $DEST にインストールしました"
        name: Install to /Applications
        basedOnDependencyAnalysis: false
    info:
      path: SupportingFiles/Info.plist
      properties:
        CFBundleName: QuickTranslate
        CFBundleDisplayName: QuickTranslate
        CFBundleIdentifier: net.kenmaz.QuickTranslate
        CFBundleVersion: "4"
        CFBundleShortVersionString: "1.3.0"
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "© 2026 kenmaz"
